    <!-- 🔥 Critical CSS + Skeleton -->
    <style>
      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: #fff;
      }
      .skeleton {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #222;
      }
      .skeleton .bar {
        background: #eee;
        height: 20px;
        margin: 10px 0;
        border-radius: 4px;
        animation: pulse 1.5s infinite;
      }
      .skeleton .bar.title {
        width: 60%;
        height: 32px;
      }
      .skeleton .bar.text {
        width: 80%;
      }
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
  </head>

  <body>
